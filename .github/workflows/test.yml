name: TeamBalancer CI
on:
  push:
    branches:
      - "**"
      - "!flutter_cd"

# cspell:disable
jobs:
  test-android:
    if: ${{ !contains(github.ref, 'ios') }}
    strategy:
      matrix:
        device:
          - "pixel_6"
          - "10.1in WXGA (Tablet)"
    runs-on: ubuntu-latest
    steps:
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls /dev/kvm

      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "17.x"
          cache: "gradle"

      - name: Get dependencies
        run: flutter pub get
      - name: Generate icons
        run: flutter pub run flutter_launcher_icons
      - name: Generate translations
        run: flutter gen-l10n
      - name: Generate sources
        run: flutter packages pub run build_runner build --delete-conflicting-outputs

      - name: Test
        run: flutter test
      - name: Integration test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          disk-size: 6000M
          heap-size: 600M
          profile: ${{ matrix.device }}
          script: |
            flutter test integration_test
            sed -i -e 's/driverTest = false/driverTest = true/g' integration_test/screenshot_test.dart
            flutter drive --driver=screenshot_test/driver.dart --target=integration_test/screenshot_test.dart

      - name: screenshot artifact
        uses: actions/upload-artifact@v7
        with:
          name: screenshots_android_${{ matrix.device }}
          path: screenshots/*

  test-ios:
    if: ${{ !contains(github.ref, 'android') }}
    strategy:
      matrix:
        device:
          - "iPhone 17 Pro Max"
          - "iPhone 17e"
          - "iPad Pro 13-inch (M5)"
    runs-on: macos-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Setup xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: "Start Simulator"
        run: |
          UDID=$(xcrun simctl list devices available --json | jq -r --arg name "${{ matrix.device }}" '[.devices[][] | select(.name == $name)] | (last // empty) | .udid')
          if [ -z "${UDID}" ]; then
            echo "::error::No simulator matching '${{ matrix.device }}' found. Available devices:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Starting simulator with UDID: ${UDID}"
          xcrun simctl boot "${UDID}"

      - name: Get dependencies
        run: flutter pub get
      - name: Generate icons
        run: flutter pub run flutter_launcher_icons
      - name: Generate translations
        run: flutter gen-l10n
      - name: Generate sources
        run: flutter packages pub run build_runner build --delete-conflicting-outputs

      - name: Test
        run: flutter test
      - name: Integration test
        run: flutter test integration_test

      - name: Take screenshots
        run: |
          sed -i '' -e 's/driverTest = false/driverTest = true/g' integration_test/screenshot_test.dart
          flutter drive --no-enable-impeller --driver=screenshot_test/driver.dart --target=integration_test/screenshot_test.dart
      - name: Screenshot artifact
        uses: actions/upload-artifact@v7
        with:
          name: screenshots_ios_${{ matrix.device }}
          path: screenshots/*
